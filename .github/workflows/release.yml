name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

# Do not run on pull_request — secrets must never be exposed to forks.
# OAuth desktop credentials are injected only during `npm run build`.

env:
  PAWN_GOOGLE_CLIENT_ID: ${{ secrets.PAWN_GOOGLE_CLIENT_ID }}
  PAWN_GOOGLE_CLIENT_SECRET: ${{ secrets.PAWN_GOOGLE_CLIENT_SECRET }}
  PAWN_GITHUB_CLIENT_ID: ${{ secrets.PAWN_GITHUB_CLIENT_ID }}
  PAWN_GITHUB_CLIENT_SECRET: ${{ secrets.PAWN_GITHUB_CLIENT_SECRET }}

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require OAuth client IDs
        run: |
          if [ -z "$PAWN_GOOGLE_CLIENT_ID" ] || [ -z "$PAWN_GITHUB_CLIENT_ID" ]; then
            echo "::error::Set repo Actions secrets PAWN_GOOGLE_CLIENT_ID and PAWN_GITHUB_CLIENT_ID (and secrets) before releasing."
            exit 1
          fi
          echo "OAuth client IDs present (values not printed)."

      - name: Install deps
        run: npm ci || npm install

      - name: Build app (injects OAuth via define)
        run: npm run build

      # Empty CSC_LINK/CSC_KEY_PASSWORD env vars make electron-builder try to load
      # a certificate from the project root and fail with "…/pawn not a file".
      # Only export signing vars when the secret is actually present.
      - name: Configure macOS code signing (optional)
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            {
              echo "CSC_LINK<<EOF"
              echo "$CSC_LINK_SECRET"
              echo "EOF"
              echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET"
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            } >> "$GITHUB_ENV"
            echo "Code signing enabled (CSC_LINK present)."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "Code signing disabled (no CSC_LINK secret)."
          fi

      - name: Package macOS (universal dmg)
        run: npm run dist:mac -- --publish never
        env:
          # Notarize only when Apple credentials are configured (afterSign hook).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            release/*.dmg
            release/latest-mac.yml
          if-no-files-found: error

  build-win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require OAuth client IDs
        shell: bash
        run: |
          if [ -z "$PAWN_GOOGLE_CLIENT_ID" ] || [ -z "$PAWN_GITHUB_CLIENT_ID" ]; then
            echo "::error::Set repo Actions secrets PAWN_GOOGLE_CLIENT_ID and PAWN_GITHUB_CLIENT_ID (and secrets) before releasing."
            exit 1
          fi
          echo "OAuth client IDs present (values not printed)."

      - name: Install deps
        run: npm ci || npm install
        env:
          GYP_MSVS_VERSION: '2022'

      - name: Build app (injects OAuth via define)
        run: npm run build

      - name: Package Windows (nsis x64 + arm64)
        run: npm run dist:win -- --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require OAuth client IDs
        run: |
          if [ -z "$PAWN_GOOGLE_CLIENT_ID" ] || [ -z "$PAWN_GITHUB_CLIENT_ID" ]; then
            echo "::error::Set repo Actions secrets PAWN_GOOGLE_CLIENT_ID and PAWN_GITHUB_CLIENT_ID (and secrets) before releasing."
            exit 1
          fi
          echo "OAuth client IDs present (values not printed)."

      - name: Install system deps for electron-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Install deps
        run: npm ci || npm install

      - name: Build app (injects OAuth via define)
        run: npm run build

      - name: Package Linux (AppImage + deb)
        run: npm run dist:linux -- --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: error

  release:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.yml' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
